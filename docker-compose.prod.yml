# Production stack. Runs on the VPS from the deploy directory, next to `.env`
# (see .env.production.example) and `secrets/github-app.pem`:
#
#   docker compose -f docker-compose.prod.yml up -d
#
# TLS and routing come from the nginx installed on the VPS and shared by its apps (vps-nginx
# project). web and api publish their ports on 127.0.0.1 only, for nginx; nothing is reachable
# from outside. Postgres sits on an internal network with no route out.
name: osg-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"
    # Stored on each log line as attrs.tag. log-shipper only forwards lines tagged osg-*.
    tag: "{{.Name}}"

x-backend: &backend
  image: ghcr.io/tem-ctrl/open-source-guru-backend:latest
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
    WEB_URL: https://${DOMAIN}
    # Inside the container the API always listens on 4000 (healthcheck, API_INTERNAL_URL).
    # API_PORT in .env is the host port published for nginx, so it must not leak in here.
    API_PORT: "4000"
    GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github_app_key
  secrets:
    - github_app_key
  logging: *logging

services:
  web:
    image: ghcr.io/tem-ctrl/open-source-guru-web:latest
    container_name: osg-web
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    ports:
      # For the host's nginx only (conf.d/open-source-guru.conf in vps-nginx).
      - 127.0.0.1:${WEB_PORT:-3001}:3000
    networks:
      - app
    logging: *logging

  api:
    <<: *backend
    container_name: osg-api
    command: ["node", "apps/api/src/server.ts"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    # Integrators call the API at api.<domain>; the browser goes through the web app's /api/* rewrite.
    ports:
      - 127.0.0.1:${API_PORT:-4001}:4000
    networks:
      - app
      - db

  worker:
    <<: *backend
    container_name: osg-worker
    command: ["node", "apps/worker/src/worker.ts"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Lets pg-boss finish the jobs in progress on shutdown.
    stop_grace_period: 60s
    networks:
      - db
      - egress

  migrate:
    <<: *backend
    container_name: osg-migrate
    command: ["node", "packages/core/src/db/migrate.ts"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - db

  postgres:
    image: postgres:18-alpine
    container_name: osg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - db
    logging: *logging

  # Forwards this stack's container logs to the OpenObserve running on the same server
  # If OpenObserve is down, it stops reading and catches up later, up to what
  # Docker's rotation still holds. See docs/deployment.md.
  log-shipper:
    image: fluent/fluent-bit:5.1.5
    container_name: osg-log-shipper
    restart: unless-stopped
    # OpenObserve's port is reached on the host's loopback, so credentials and logs stay on the
    # server. Nothing listens here: Fluent Bit's HTTP server is off.
    network_mode: host
    command: ["/fluent-bit/bin/fluent-bit", "-c", "/fluent-bit/etc/osg.yaml"]
    environment:
      OPENOBSERVE_USER: ${OPENOBSERVE_USER:-}
      OPENOBSERVE_PASSWORD: ${OPENOBSERVE_PASSWORD:-}
    configs:
      - source: log_shipper
        target: /fluent-bit/etc/osg.yaml
    volumes:
      # Holds every container's logs on the server, not only this stack's. The grep filter below
      # drops the others.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - log-shipper-state:/var/lib/fluent-bit
    cap_drop:
      - ALL
    mem_limit: 128m
    # No tag: forwarding its own logs would feed every delivery error back into OpenObserve.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

configs:
  # Inline because the Deploy workflow only copies this file to the server.
  log_shipper:
    content: |
      service:
        flush: 5
        log_level: warn

      parsers:
        - name: docker_json_file
          format: json
          time_key: time
          time_format: "%Y-%m-%dT%H:%M:%S.%L%z"

        - name: app_json
          format: json

      pipeline:
        inputs:
          - name: tail
            path: /var/lib/docker/containers/*/*-json.log
            parser: docker_json_file
            db: /var/lib/fluent-bit/tail.db
            # Pauses reading, instead of dropping, while OpenObserve can't keep up.
            mem_buf_limit: 32MB
            skip_long_lines: on

        filters:
          - name: grep
            match: "*"
            regex: "$$attrs['tag'] ^osg-"

          - name: nest
            match: "*"
            operation: lift
            nested_under: attrs

          - name: modify
            match: "*"
            rename: tag container

          # pino lines become fields (level, msg, ...). Others, such as Postgres, stay in `log`.
          - name: parser
            match: "*"
            key_name: log
            parser: app_json
            reserve_data: on

        outputs:
          - name: http
            match: "*"
            host: 127.0.0.1
            port: 5080
            uri: /api/default/open_source_guru/_json
            tls: off
            format: json
            json_date_key: _timestamp
            json_date_format: iso8601
            http_user: $${OPENOBSERVE_USER}
            http_passwd: $${OPENOBSERVE_PASSWORD}
            compress: gzip
            retry_limit: no_limits

secrets:
  github_app_key:
    file: ./secrets/github-app.pem

volumes:
  postgres-data:
  log-shipper-state:

networks:
  # web → api, and outbound access (GitHub, SMTP) for the api.
  app:
  # Postgres and the backend services. No outbound access.
  db:
    internal: true
  # Outbound access (GitHub, SMTP) for the worker.
  egress:
