name: Deploy

# Deploys the `latest` images built by docker-build-push.yml to the VPS over SSH (see
# docs/deployment.md). Called by release.yml after a merge to main; can also be run by hand.
# The `production` environment holds:
#   secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY (private key), VPS_KNOWN_HOSTS (`ssh-keyscan <host>` output),
#            PRIVATE_KEY_GITHUB_APP (production GitHub App .pem; secret names can't start with GITHUB_)
#   variables: VPS_PORT (optional, default 22), DEPLOY_PATH (optional, default /opt/open-source-guru)
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://open-source-guru.dev
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/open-source-guru' }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
        run: |
          [ -n "$VPS_HOST" ] || { echo "Required production environment secret VPS_HOST is empty" >&2; exit 1; }
          [ -n "$VPS_USER" ] || { echo "Required production environment secret VPS_USER is empty" >&2; exit 1; }
          [ -n "$SSH_KEY" ] || { echo "Required production environment secret VPS_SSH_KEY is empty" >&2; exit 1; }
          [ -n "$KNOWN_HOSTS" ] || { echo "Required production environment secret VPS_KNOWN_HOSTS is empty" >&2; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName $VPS_HOST
            Port $VPS_PORT
            User $VPS_USER
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ConnectTimeout 15
          EOF

      # Fails the job early, with a clear message, if the server can't be reached.
      - name: Check the SSH connection
        run: |
          ssh vps bash -s -- "$DEPLOY_PATH" <<'EOF'
          test -f "$1/.env" || { echo "$1/.env is missing: see docs/deployment.md" >&2; exit 1; }
          EOF

      # The key goes through ssh's stdin, never to disk on the runner or in a command line. The
      # containers read it as uid 1000 (`node`), so the file must belong to that uid.
      - name: Upload GitHub App private key
        id: app-key
        env:
          APP_KEY: ${{ secrets.PRIVATE_KEY_GITHUB_APP }}
        run: |
          [ -n "$APP_KEY" ] || { echo "The PRIVATE_KEY_GITHUB_APP secret is empty" >&2; exit 1; }
          script=$(cat <<'EOF'
          set -eu
          umask 077
          mkdir -p "$DEPLOY_PATH/secrets"
          cd "$DEPLOY_PATH/secrets"
          cat > github-app.pem.new
          if cmp -s github-app.pem.new github-app.pem; then
            rm github-app.pem.new
            echo unchanged
            exit 0
          fi
          chmod 400 github-app.pem.new
          if [ "$(id -u)" != 1000 ]; then sudo -n chown 1000 github-app.pem.new; fi
          mv -f github-app.pem.new github-app.pem
          echo changed
          EOF
          )
          result=$(printf '%s\n' "$APP_KEY" | ssh vps "DEPLOY_PATH='$DEPLOY_PATH'; $script")
          echo "GitHub App key: $result"
          echo "changed=$([ "$result" = changed ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Upload compose file
        run: scp docker-compose.prod.yml "vps:$DEPLOY_PATH/docker-compose.prod.yml"

      - name: Pull and restart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          KEY_CHANGED: ${{ steps.app-key.outputs.changed }}
        # The registry login only lasts for this job. `--wait` fails if a container doesn't
        # become healthy. The app reads the GitHub App key at startup, so a new key needs api and
        # worker recreated. Each ssh call closes its connection when its command ends.
        run: |
          printf '%s\n' "$GHCR_TOKEN" | ssh vps docker login ghcr.io -u "$ACTOR" --password-stdin
          ssh vps bash -s -- "$DEPLOY_PATH" "$KEY_CHANGED" <<'EOF'
          set -euo pipefail
          trap 'docker logout ghcr.io >/dev/null' EXIT
          cd "$1"
          docker compose -f docker-compose.prod.yml up -d --pull always --remove-orphans \
            --wait --wait-timeout 180
          if [ "$2" = true ]; then
            docker compose -f docker-compose.prod.yml up -d --force-recreate --no-deps \
              --wait --wait-timeout 180 api worker
          fi
          docker image prune -f
          EOF
